name: Build APK

on:
  push:
    tags: ['v*']          # e.g. `git tag v1.0.0 && git push origin v1.0.0`
  workflow_dispatch:        # manual "Run workflow" button (artifact only)

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # needed to create / update the Release

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Android SDK/NDK + python-for-android tree is ~1.5 GB; cache it
      # so only the first run (or a buildozer.spec change) pays the full
      # download + compile. Restore-only here + a save step gated on
      # success(), so a half-finished .buildozer from a failed run never
      # gets persisted and poisons later runs (that's what produced the
      # "build-tools folder not found / Aidl not found" error -- a partial
      # SDK from an earlier broken run was being restored).
      - name: Restore Buildozer cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .buildozer
          key: buildozer-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-v2-

      - name: Build debug APK
        run: |
          mkdir -p .buildozer
          # The image's ENTRYPOINT is already `buildozer`, so the args are
          # just `android debug` (passing `buildozer android debug` makes it
          # run `buildozer buildozer android debug` -> "Unknown command/target
          # buildozer"). The container runs as uid 1000 while the runner
          # checkout is uid 1001, so hand the tree over for the build.
          sudo chown -R 1000:1000 "$PWD"
          docker run --rm \
            --volume "$PWD":/home/user/hostcwd \
            --volume "$PWD/.buildozer":/home/user/.buildozer \
            ghcr.io/kivy/buildozer:latest \
            android debug

      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$PWD"

      # Only persist .buildozer after a green build, and only when the
      # exact key wasn't already a hit.
      - name: Save Buildozer cache
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .buildozer
          key: buildozer-v2-${{ hashFiles('buildozer.spec') }}

      # Always available from the run's "Artifacts" section, tag or not.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: robocontroller-apk
          path: bin/*.apk
          if-no-files-found: error

      # Only when triggered by a version tag: publish under Releases.
      - name: Attach APK to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
