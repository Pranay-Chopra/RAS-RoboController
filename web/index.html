<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RAS Quiz">
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="manifest.webmanifest">
<title>RAS Quiz</title>
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="topbar"><h1>Quiz</h1></header>

  <div id="account" class="account hidden">
    <span id="account-label"></span>
    <button id="signout" class="link-btn" type="button">SIGN OUT</button>
  </div>

  <div id="status" class="status"></div>

  <nav id="tabs" class="tabs hidden">
    <button class="tab active" type="button" data-tab="manage">MANAGE</button>
    <button class="tab" type="button" data-tab="results">RESULTS</button>
  </nav>

  <main id="view-quiz" class="view"></main>
  <main id="view-results" class="view hidden"></main>

  <div id="toast" class="toast hidden"></div>
  <div id="modal-root"></div>

  <script src="quiz.js"></script>
</body>
</html>
